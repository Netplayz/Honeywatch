name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     22
          script: |
            set -e
            echo "==> Pulling latest code"
            git -C /opt/honeywatch fetch origin
            git -C /opt/honeywatch reset --hard origin/main

            echo "==> Installing dependencies"
            /opt/honeywatch/venv/bin/pip install -q -r /opt/honeywatch/requirements.txt

            echo "==> Restarting service"
            systemctl restart honeywatch
            sleep 2

            echo "==> Verifying"
            systemctl is-active honeywatch \
              && echo "✔ HoneyWatch is running" \
              || { journalctl -u honeywatch -n 20 --no-pager; exit 1; }
