<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyWatch — Threat Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1117;
    --surface2: #141b24;
    --border: #1e2d3d;
    --accent: #00d4ff;
    --accent2: #ff3864;
    --accent3: #39ff14;
    --warn: #ffaa00;
    --text: #c9d1d9;
    --muted: #586069;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,0.015) 2px,
      rgba(0,212,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .live-badge {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent3);
    border: 1px solid var(--accent3);
    padding: 3px 10px;
    border-radius: 2px;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent3);
    animation: blink 1s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 57px);
  }

  /* Stat bar */
  .stat-bar {
    grid-column: 1 / -1;
    display: flex;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-item {
    flex: 1;
    background: var(--surface);
    padding: 14px 20px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
    transition: all 0.3s;
  }

  .stat-value.danger { color: var(--accent2); }
  .stat-value.warn { color: var(--warn); }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Main */
  .main {
    display: grid;
    grid-template-rows: 1fr 220px;
    overflow: hidden;
  }

  /* Map */
  #map {
    background: #050810;
    z-index: 1;
  }

  /* Feed */
  .feed {
    border-top: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .feed-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-family: var(--mono);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .feed-body {
    overflow-y: auto;
    flex: 1;
    font-family: var(--mono);
    font-size: 11px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    position: sticky; top: 0;
    background: var(--surface2);
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 6px 12px;
    text-align: left;
    font-family: var(--sans);
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 5px 12px;
    border-bottom: 1px solid rgba(30,45,61,0.5);
    font-family: var(--mono);
  }

  tr:hover td { background: rgba(0,212,255,0.04); }

  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 2px;
    font-size: 10px;
    font-family: var(--mono);
    font-weight: bold;
  }

  .badge-ssh   { background: rgba(0,212,255,0.15); color: var(--accent); }
  .badge-http  { background: rgba(57,255,20,0.12); color: var(--accent3); }
  .badge-telnet{ background: rgba(255,170,0,0.15); color: var(--warn); }
  .badge-ftp   { background: rgba(255,56,100,0.15); color: var(--accent2); }

  .ip-bad { color: var(--accent2); }
  .ip-ok  { color: var(--text); }

  /* Sidebar widgets */
  .widget {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .widget-title {
    padding: 8px 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-family: var(--mono);
    border-bottom: 1px solid var(--border);
    background: rgba(0,212,255,0.04);
  }

  .widget-body { padding: 10px 12px; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }

  .bar-label { width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .bar-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; }
  .bar-fill  { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.5s; }
  .bar-count { width: 40px; text-align: right; color: var(--muted); font-family: var(--mono); font-size: 11px; }

  canvas#svcChart { max-height: 140px; }

  /* New event flash */
  @keyframes flash-row {
    from { background: rgba(0,212,255,0.2); }
    to   { background: transparent; }
  }
  .new-row td { animation: flash-row 1.5s ease-out; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    HONEYWATCH
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    LIVE MONITORING
  </div>
</header>

<div class="layout">
  <!-- Stat bar -->
  <div class="stat-bar">
    <div class="stat-item">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total Events</div>
    </div>
    <div class="stat-item">
      <div class="stat-value warn" id="stat-1h">—</div>
      <div class="stat-label">Last Hour</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-24h">—</div>
      <div class="stat-label">Last 24h</div>
    </div>
    <div class="stat-item">
      <div class="stat-value danger" id="stat-bad">—</div>
      <div class="stat-label">Known Threat IPs</div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="widget">
      <div class="widget-title">By Service</div>
      <div class="widget-body">
        <canvas id="svcChart"></canvas>
      </div>
    </div>

    <div class="widget">
      <div class="widget-title">Top Source Countries</div>
      <div class="widget-body" id="countries-list">
        <div style="color:var(--muted);font-size:12px">Loading…</div>
      </div>
    </div>

    <div class="widget">
      <div class="widget-title">Top Usernames Tried</div>
      <div class="widget-body" id="usernames-list">
        <div style="color:var(--muted);font-size:12px">Loading…</div>
      </div>
    </div>

    <div class="widget">
      <div class="widget-title">Top Passwords Tried</div>
      <div class="widget-body" id="passwords-list">
        <div style="color:var(--muted);font-size:12px">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Main panel -->
  <div class="main">
    <div id="map"></div>

    <div class="feed">
      <div class="feed-header">
        <span>Live Event Feed</span>
        <span id="feed-count" style="color:var(--muted)">0 events</span>
      </div>
      <div class="feed-body">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>IP</th>
              <th>Service</th>
              <th>Type</th>
              <th>Credentials</th>
              <th>Location</th>
              <th>Threat</th>
            </tr>
          </thead>
          <tbody id="event-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false, attributionControl: false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);
map.setView([20, 0], 2);
L.control.zoom({ position: 'topright' }).addTo(map);

const markers = {};

function addOrUpdateMarker(row) {
  if (!row.latitude || !row.longitude) return;
  const key = row.src_ip;
  const color = row.is_known_bad ? '#ff3864' : '#00d4ff';
  if (markers[key]) {
    markers[key].setStyle({ color });
    return;
  }
  const circle = L.circleMarker([row.latitude, row.longitude], {
    radius: 5,
    color,
    fillColor: color,
    fillOpacity: 0.7,
    weight: 1.5,
  }).addTo(map);
  circle.bindPopup(`
    <div style="font-family:monospace;font-size:12px;color:#000">
      <b>${row.src_ip}</b><br>
      ${row.city || ''}${row.city && row.country ? ', ' : ''}${row.country || ''}<br>
      ISP: ${row.isp || 'unknown'}<br>
      ${row.is_known_bad ? '<span style="color:red">⚠ Known threat IP</span>' : ''}
    </div>
  `);
  markers[key] = circle;
}

// ── Charts ─────────────────────────────────────────────────────────────────
const svcCtx = document.getElementById('svcChart').getContext('2d');
const svcChart = new Chart(svcCtx, {
  type: 'doughnut',
  data: { labels: [], datasets: [{ data: [], backgroundColor: ['#00d4ff','#39ff14','#ffaa00','#ff3864','#a855f7'] }] },
  options: {
    plugins: { legend: { labels: { color: '#c9d1d9', font: { family: 'Share Tech Mono', size: 11 } } } },
    cutout: '60%',
  }
});

// ── Bar list helper ────────────────────────────────────────────────────────
function renderBarList(containerId, items, labelKey, countKey, maxCount) {
  const el = document.getElementById(containerId);
  if (!items.length) { el.innerHTML = '<div style="color:var(--muted);font-size:12px">No data</div>'; return; }
  el.innerHTML = items.map(item => `
    <div class="bar-row">
      <div class="bar-label" title="${item[labelKey]}">${item[labelKey] || '—'}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((item[countKey]/maxCount)*100)}%"></div></div>
      <div class="bar-count">${item[countKey].toLocaleString()}</div>
    </div>
  `).join('');
}

// ── Feed table ─────────────────────────────────────────────────────────────
const tbody = document.getElementById('event-tbody');
let feedCount = 0;

function svcBadge(svc) {
  const cls = `badge-${(svc||'').toLowerCase()}`;
  return `<span class="badge ${cls}">${svc}</span>`;
}

function prependRow(row, flash=false) {
  const tr = document.createElement('tr');
  if (flash) tr.className = 'new-row';
  const ts = new Date(row.timestamp).toLocaleTimeString();
  const ipCls = row.is_known_bad ? 'ip-bad' : 'ip-ok';
  const creds = [row.username ? `u:${row.username}` : '', row.password ? `p:${row.password}` : ''].filter(Boolean).join(' ');
  const loc = [row.city, row.country].filter(Boolean).join(', ') || '—';
  const threat = row.is_known_bad ? `<span style="color:var(--accent2)">⚠ THREAT</span>` : '<span style="color:var(--muted)">—</span>';

  tr.innerHTML = `
    <td>${ts}</td>
    <td class="${ipCls}">${row.src_ip}</td>
    <td>${svcBadge(row.service)}</td>
    <td style="color:var(--muted)">${row.event_type}</td>
    <td style="color:var(--warn)">${creds || '—'}</td>
    <td>${loc}</td>
    <td>${threat}</td>
  `;
  tbody.prepend(tr);
  feedCount++;
  document.getElementById('feed-count').textContent = `${feedCount.toLocaleString()} events`;
  // Trim to 500 rows
  while (tbody.rows.length > 500) tbody.deleteRow(tbody.rows.length - 1);
}

// ── Stats refresh ──────────────────────────────────────────────────────────
async function refreshStats() {
  try {
    const r = await fetch('/api/stats');
    const s = await r.json();

    document.getElementById('stat-total').textContent = s.total.toLocaleString();
    document.getElementById('stat-1h').textContent   = s.last_hour.toLocaleString();
    document.getElementById('stat-24h').textContent  = s.last_24h.toLocaleString();
    document.getElementById('stat-bad').textContent  = s.known_bad_count.toLocaleString();

    // Service chart
    svcChart.data.labels = s.by_service.map(x => x.service);
    svcChart.data.datasets[0].data = s.by_service.map(x => x.cnt);
    svcChart.update('none');

    // Bar lists
    const maxC = s.top_countries[0]?.cnt || 1;
    renderBarList('countries-list', s.top_countries, 'country', 'cnt', maxC);

    const maxU = s.top_usernames[0]?.cnt || 1;
    renderBarList('usernames-list', s.top_usernames, 'username', 'cnt', maxU);

    const maxP = s.top_passwords[0]?.cnt || 1;
    renderBarList('passwords-list', s.top_passwords, 'password', 'cnt', maxP);

    // Map markers
    s.geo_points.forEach(pt => addOrUpdateMarker(pt));

  } catch(e) { console.error('Stats error', e); }
}

// ── Initial events load ────────────────────────────────────────────────────
async function loadInitialEvents() {
  const r = await fetch('/api/events?limit=100');
  const events = await r.json();
  events.reverse().forEach(row => {
    prependRow(row, false);
    addOrUpdateMarker(row);
  });
}

// ── SSE live feed ──────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/api/stream');
  es.onmessage = async (e) => {
    // Fetch fresh event details (SSE only sends summary)
    await refreshStats();
    const r = await fetch('/api/events?limit=1');
    const events = await r.json();
    if (events[0]) prependRow(events[0], true);
  };
  es.onerror = () => {
    setTimeout(connectSSE, 5000);
    es.close();
  };
}

// ── Boot ───────────────────────────────────────────────────────────────────
(async () => {
  await refreshStats();
  await loadInitialEvents();
  connectSSE();
  setInterval(refreshStats, 30_000);
})();
</script>
</body>
</html>
