<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyWatch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07090f;
  --surface: #0d1117;
  --card:    #111923;
  --border:  #1c2a3a;
  --accent:  #00d4ff;
  --red:     #ff3864;
  --green:   #39ff14;
  --yellow:  #ffaa00;
  --muted:   #4a5568;
  --text:    #c9d1d9;
  --mono:    'Share Tech Mono', monospace;
  --sans:    'Rajdhani', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }

/* scanlines */
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px,
    rgba(0,212,255,.012) 2px, rgba(0,212,255,.012) 4px);
}

/* ── Header ── */
header {
  height: 52px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
}
.logo { font-family: var(--mono); font-size: 16px; color: var(--accent); letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
.logo-hex {
  width: 28px; height: 28px; background: var(--accent);
  clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.live { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--green); border: 1px solid var(--green); padding: 3px 10px; border-radius: 2px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── Layout ── */
.layout {
  position: fixed; top: 52px; bottom: 0; left: 0; right: 0;
  display: grid;
  grid-template-columns: 270px 1fr;
  grid-template-rows: 70px 1fr 200px;
}

/* ── Stat bar ── */
.stat-bar {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--border);
}
.stat { background: var(--surface); padding: 12px 18px; border-right: 1px solid var(--border); }
.stat:last-child { border-right: none; }
.stat-val { font-family: var(--mono); font-size: 26px; color: var(--accent); line-height: 1; transition: color .3s; }
.stat-val.warn  { color: var(--yellow); }
.stat-val.danger{ color: var(--red); }
.stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

/* ── Sidebar ── */
.sidebar {
  grid-row: 2 / 4;
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px;
}
.widget { background: var(--card); border: 1px solid var(--border); border-radius: 3px; }
.widget-head {
  padding: 7px 12px; font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--accent);
  border-bottom: 1px solid var(--border); background: rgba(0,212,255,.04);
}
.widget-body { padding: 10px 12px; }
.bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 12px; }
.bar-label { width: 85px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.bar-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
.bar-fill  { height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s; }
.bar-count { width: 42px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* ── Map ── */
#map { background: #050810; }

/* ── Feed ── */
.feed {
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column; overflow: hidden;
}
.feed-head {
  padding: 6px 14px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--accent);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.feed-body { overflow-y: auto; flex: 1; }
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 10; }
th {
  background: var(--card); color: var(--muted); text-align: left;
  padding: 5px 12px; font-family: var(--sans); font-size: 10px;
  text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border);
}
td { padding: 4px 12px; font-family: var(--mono); font-size: 11px; border-bottom: 1px solid rgba(28,42,58,.6); }
tr:hover td { background: rgba(0,212,255,.04); }

.badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 10px; font-weight: bold; font-family: var(--mono); }
.ssh    { background: rgba(0,212,255,.15); color: var(--accent); }
.http   { background: rgba(57,255,20,.12); color: var(--green); }
.telnet { background: rgba(255,170,0,.15); color: var(--yellow); }
.ftp    { background: rgba(255,56,100,.15); color: var(--red); }

.ip-bad { color: var(--red); }

@keyframes flash { from { background: rgba(0,212,255,.18); } to { background: transparent; } }
.new-row td { animation: flash 1.5s ease-out; }

canvas { max-height: 150px; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-hex"></div>HONEYWATCH</div>
  <div class="live"><div class="live-dot"></div>LIVE</div>
</header>

<div class="layout">

  <!-- Stat bar -->
  <div class="stat-bar">
    <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total Events</div></div>
    <div class="stat"><div class="stat-val warn" id="s-1h">—</div><div class="stat-lbl">Last Hour</div></div>
    <div class="stat"><div class="stat-val" id="s-24h">—</div><div class="stat-lbl">Last 24h</div></div>
    <div class="stat"><div class="stat-val danger" id="s-bad">—</div><div class="stat-lbl">Threat IPs</div></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="widget">
      <div class="widget-head">By Service</div>
      <div class="widget-body"><canvas id="svcChart"></canvas></div>
    </div>
    <div class="widget">
      <div class="widget-head">Top Countries</div>
      <div class="widget-body" id="w-countries"><span style="color:var(--muted);font-size:11px">Loading…</span></div>
    </div>
    <div class="widget">
      <div class="widget-head">Top Usernames</div>
      <div class="widget-body" id="w-users"><span style="color:var(--muted);font-size:11px">Loading…</span></div>
    </div>
    <div class="widget">
      <div class="widget-head">Top Passwords</div>
      <div class="widget-body" id="w-passes"><span style="color:var(--muted);font-size:11px">Loading…</span></div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Feed -->
  <div class="feed">
    <div class="feed-head">
      <span>Live Event Feed</span>
      <span id="feed-count" style="color:var(--muted)">0 events</span>
    </div>
    <div class="feed-body">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>IP</th><th>Service</th>
            <th>Type</th><th>Credentials</th><th>Location</th><th>Threat</th>
          </tr>
        </thead>
        <tbody id="feed-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ── Map ────────────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false, attributionControl: false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
map.setView([20, 0], 2);
L.control.zoom({ position: 'topright' }).addTo(map);

const _markers = {};
function placeMarker(row) {
  if (!row.latitude || !row.longitude) return;
  const color = row.is_known_bad ? '#ff3864' : '#00d4ff';
  if (_markers[row.src_ip]) {
    _markers[row.src_ip].setStyle({ color, fillColor: color });
    return;
  }
  const m = L.circleMarker([row.latitude, row.longitude], {
    radius: 5, color, fillColor: color, fillOpacity: .7, weight: 1.5
  }).addTo(map);
  m.bindPopup(`<div style="font-family:monospace;font-size:12px">
    <b>${row.src_ip}</b><br>
    ${[row.city, row.country].filter(Boolean).join(', ') || 'Unknown'}<br>
    ${row.isp || ''}<br>
    ${row.is_known_bad ? '<span style="color:red">⚠ Known threat</span>' : ''}
  </div>`);
  _markers[row.src_ip] = m;
}

// ── Service chart ──────────────────────────────────────────────────────────────
const svcChart = new Chart(
  document.getElementById('svcChart').getContext('2d'),
  {
    type: 'doughnut',
    data: {
      labels: [],
      datasets: [{ data: [], backgroundColor: ['#00d4ff','#39ff14','#ffaa00','#ff3864','#a855f7'] }]
    },
    options: {
      plugins: { legend: { labels: { color: '#c9d1d9', font: { family: 'Share Tech Mono', size: 11 } } } },
      cutout: '55%',
    }
  }
);

// ── Bar lists ──────────────────────────────────────────────────────────────────
function renderBars(id, items, labelKey, countKey) {
  const el = document.getElementById(id);
  if (!items || !items.length) { el.innerHTML = '<span style="color:var(--muted);font-size:11px">No data yet</span>'; return; }
  const max = items[0][countKey] || 1;
  el.innerHTML = items.map(item => `
    <div class="bar-row">
      <div class="bar-label" title="${item[labelKey] || ''}">${item[labelKey] || '—'}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(item[countKey]/max*100)}%"></div></div>
      <div class="bar-count">${Number(item[countKey]).toLocaleString()}</div>
    </div>`).join('');
}

// ── Feed table ─────────────────────────────────────────────────────────────────
const tbody = document.getElementById('feed-tbody');
let feedTotal = 0;

function badgeHtml(svc) {
  const cls = (svc || '').toLowerCase();
  return `<span class="badge ${cls}">${svc || '?'}</span>`;
}

function addRow(row, flash) {
  const tr = document.createElement('tr');
  if (flash) tr.className = 'new-row';
  const time  = new Date(row.timestamp).toLocaleTimeString();
  const creds = [row.username ? 'u:' + row.username : '', row.password ? 'p:' + row.password : ''].filter(Boolean).join(' ');
  const loc   = [row.city, row.country].filter(Boolean).join(', ') || '—';
  const threat = row.is_known_bad
    ? `<span style="color:var(--red)">⚠ THREAT</span>`
    : `<span style="color:var(--muted)">—</span>`;
  tr.innerHTML = `
    <td>${time}</td>
    <td class="${row.is_known_bad ? 'ip-bad' : ''}">${row.src_ip || '—'}</td>
    <td>${badgeHtml(row.service)}</td>
    <td style="color:var(--muted)">${row.event_type || ''}</td>
    <td style="color:var(--yellow)">${creds || '—'}</td>
    <td>${loc}</td>
    <td>${threat}</td>`;
  tbody.prepend(tr);
  feedTotal++;
  document.getElementById('feed-count').textContent = feedTotal.toLocaleString() + ' events';
  while (tbody.rows.length > 500) tbody.deleteRow(tbody.rows.length - 1);
}

// ── Stats refresh ──────────────────────────────────────────────────────────────
async function refreshStats() {
  try {
    const stats = await fetch('/api/stats').then(r => r.json());
    document.getElementById('s-total').textContent = Number(stats.total).toLocaleString();
    document.getElementById('s-1h').textContent    = Number(stats.last_hour).toLocaleString();
    document.getElementById('s-24h').textContent   = Number(stats.last_24h).toLocaleString();
    document.getElementById('s-bad').textContent   = Number(stats.known_bad_count).toLocaleString();

    svcChart.data.labels = stats.by_service.map(x => x.service);
    svcChart.data.datasets[0].data = stats.by_service.map(x => x.cnt);
    svcChart.update('none');

    renderBars('w-countries', stats.top_countries, 'country',  'cnt');
    renderBars('w-users',     stats.top_usernames, 'username', 'cnt');
    renderBars('w-passes',    stats.top_passwords, 'password', 'cnt');

    (stats.geo_points || []).forEach(placeMarker);
  } catch (e) {
    console.warn('Stats fetch failed:', e);
  }
}

// ── Initial event load ─────────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const events = await fetch('/api/events?limit=100').then(r => r.json());
    [...events].reverse().forEach(row => { addRow(row, false); placeMarker(row); });
  } catch (e) {
    console.warn('Events fetch failed:', e);
  }
}

// ── SSE live stream ────────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/api/stream');
  es.onmessage = async () => {
    await refreshStats();
    try {
      const latest = await fetch('/api/events?limit=1').then(r => r.json());
      if (latest[0]) addRow(latest[0], true);
    } catch (_) {}
  };
  es.onerror = () => { es.close(); setTimeout(connectSSE, 5000); };
}

// ── Boot ───────────────────────────────────────────────────────────────────────
(async () => {
  await refreshStats();
  await loadEvents();
  connectSSE();
  setInterval(refreshStats, 30000);
})();
</script>
</body>
</html>
