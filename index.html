<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyWatch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0a0a0a;
  --surface: #111111;
  --card:    #161616;
  --border:  #282828;
  --border2: #1e1e1e;
  --accent:  #c87d1a;
  --amber2:  #8a5510;
  --threat:  #b33a2a;
  --text:    #cec5b4;
  --dim:     #7a7060;
  --mono:    'IBM Plex Mono', monospace;
  --num:     'Bebas Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }

header {
  height: 46px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
}
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo-mark { font-size: 18px; font-weight: 500; color: var(--accent); line-height: 1; }
.logo-sub  { font-size: 10px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
.header-right { display: flex; align-items: center; gap: 18px; }
.conn-status { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .15em; color: var(--dim); }
.conn-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.conn-dot.live { animation: throb 2.4s ease-in-out infinite; }
@keyframes throb { 0%,100%{opacity:1} 50%{opacity:.3} }
.ts { font-size: 10px; color: var(--dim); letter-spacing: .08em; border-left: 1px solid var(--border); padding-left: 18px; }

.layout {
  position: fixed; top: 46px; bottom: 0; left: 0; right: 0;
  display: grid;
  grid-template-columns: 256px 1fr;
  grid-template-rows: 64px 1fr 196px;
}

.stat-bar {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--border);
}
.stat {
  padding: 10px 18px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: center;
  position: relative;
}
.stat:last-child { border-right: none; }
.stat::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 2px; height: 100%;
  background: var(--border2);
}
.stat.s-active::before { background: var(--accent); }
.stat.s-warn::before   { background: var(--amber2); }
.stat.s-danger::before { background: var(--threat); }
.stat-val { font-family: var(--num); font-size: 30px; line-height: 1; color: var(--text); letter-spacing: .02em; }
.stat-lbl { font-size: 9px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; margin-top: 3px; }

.sidebar {
  grid-row: 2 / 4;
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}
.widget { border-bottom: 1px solid var(--border); }
.widget-head {
  padding: 8px 14px; font-size: 9px; letter-spacing: .2em; color: var(--dim);
  text-transform: uppercase; border-bottom: 1px solid var(--border2); background: var(--card);
}
.widget-body { padding: 10px 14px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label { width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--text); }
.bar-track { flex: 1; height: 2px; background: var(--border); }
.bar-fill  { height: 100%; background: var(--accent); transition: width .4s ease; }
.bar-count { width: 38px; text-align: right; font-size: 10px; color: var(--dim); }

#map { background: #080808; }

.feed { border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
.feed-head {
  padding: 0 14px; height: 32px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.feed-head-title { font-size: 9px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.feed-head-count { font-size: 10px; color: var(--dim); }

.export-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px; height: 30px;
  border-bottom: 1px solid var(--border2);
  background: var(--card); flex-shrink: 0;
}
.export-bar label { font-size: 9px; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; }
.export-bar select,
.export-bar input {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size: 10px; padding: 2px 6px; outline: none; border-radius: 0;
}
.export-bar select:focus, .export-bar input:focus { border-color: var(--accent); }
.export-bar input[type="datetime-local"] { color-scheme: dark; }
.btn-export {
  margin-left: auto;
  background: transparent; border: 1px solid var(--amber2);
  color: var(--accent); font-family: var(--mono); font-size: 9px;
  padding: 3px 12px; cursor: pointer; letter-spacing: .15em; text-transform: uppercase;
  transition: background .15s; border-radius: 0;
}
.btn-export:hover { background: var(--amber2); color: var(--bg); }
.btn-export.loading { opacity: .45; cursor: wait; }

.feed-body { overflow-y: auto; flex: 1; }
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 10; }
th {
  background: var(--card); color: var(--dim); text-align: left;
  padding: 4px 10px; font-size: 9px; letter-spacing: .18em;
  text-transform: uppercase; border-bottom: 1px solid var(--border); font-weight: 400;
}
td { padding: 4px 10px; font-size: 11px; color: var(--text); border-bottom: 1px solid var(--border2); }
tr:hover td { background: rgba(200,125,26,.04); }

.badge {
  display: inline-block; padding: 1px 5px;
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--border); color: var(--dim);
}
.badge.ssh    { border-color: #6a4010; color: #c87d1a; }
.badge.http   { border-color: #3a4a30; color: #7aaa5a; }
.badge.telnet { border-color: #3a3020; color: #aaa060; }
.badge.ftp    { border-color: #3a2020; color: #a06060; }
.badge.smtp   { border-color: #203a3a; color: #60a0aa; }
.badge.rdp    { border-color: #2a2040; color: #8070c0; }
.badge.mysql  { border-color: #3a2830; color: #aa7090; }
.badge.redis  { border-color: #3a1a1a; color: #cc5050; }
.badge.smb    { border-color: #2a3020; color: #708850; }

.ip-threat  { color: var(--threat); }
.threat-yes { color: var(--threat); font-size: 10px; }
.threat-no  { color: var(--border); font-size: 10px; }
.cred-text  { color: var(--accent); font-size: 10px; }

@keyframes rowflash { from { background: rgba(200,125,26,.12); } to { background: transparent; } }
.new-row td { animation: rowflash 1.2s ease-out; }

canvas { max-height: 140px; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark">HW</span>
    <span class="logo-sub">HoneyWatch</span>
  </div>
  <div class="header-right">
    <div class="conn-status">
      <div class="conn-dot live" id="conn-dot"></div>
      <span id="conn-label">CONNECTED</span>
    </div>
    <div class="ts" id="hdr-ts"></div>
  </div>
</header>

<div class="layout">

  <div class="stat-bar">
    <div class="stat s-active"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total Events</div></div>
    <div class="stat s-warn">  <div class="stat-val" id="s-1h">—</div>   <div class="stat-lbl">Last Hour</div></div>
    <div class="stat">         <div class="stat-val" id="s-24h">—</div>  <div class="stat-lbl">Last 24 h</div></div>
    <div class="stat s-danger"><div class="stat-val" id="s-bad">—</div>  <div class="stat-lbl">Threat IPs</div></div>
  </div>

  <div class="sidebar">
    <div class="widget">
      <div class="widget-head">By Service</div>
      <div class="widget-body"><canvas id="svcChart"></canvas></div>
    </div>
    <div class="widget">
      <div class="widget-head">Top Countries</div>
      <div class="widget-body" id="w-countries"><span style="color:var(--dim);font-size:11px">Waiting…</span></div>
    </div>
    <div class="widget">
      <div class="widget-head">Top Usernames</div>
      <div class="widget-body" id="w-users"><span style="color:var(--dim);font-size:11px">Waiting…</span></div>
    </div>
    <div class="widget">
      <div class="widget-head">Top Passwords</div>
      <div class="widget-body" id="w-passes"><span style="color:var(--dim);font-size:11px">Waiting…</span></div>
    </div>
  </div>

  <div id="map"></div>

  <div class="feed">
    <div class="feed-head">
      <span class="feed-head-title">Event Stream</span>
      <span class="feed-head-count" id="feed-count">0 events</span>
    </div>
    <div class="export-bar">
      <label>Service</label>
      <select id="ex-service">
        <option value="">All</option>
        <option>SSH</option><option>HTTP</option><option>Telnet</option>
        <option>FTP</option><option>SMTP</option><option>RDP</option>
        <option>MySQL</option><option>Redis</option><option>SMB</option>
      </select>
      <label>Since</label>
      <input type="datetime-local" id="ex-since">
      <label>Format</label>
      <select id="ex-format">
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
      </select>
      <label>Limit</label>
      <select id="ex-limit">
        <option value="1000">1 000</option>
        <option value="5000">5 000</option>
        <option value="10000" selected>10 000</option>
        <option value="50000">50 000</option>
        <option value="100000">100 000</option>
      </select>
      <button class="btn-export" id="btn-export" onclick="doExport()">Export</button>
    </div>
    <div class="feed-body">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>IP</th><th>Service</th>
            <th>Type</th><th>Credentials</th><th>Location</th><th>Threat</th>
          </tr>
        </thead>
        <tbody id="feed-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
function tickClock() {
  document.getElementById('hdr-ts').textContent =
    new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
}
tickClock();
setInterval(tickClock, 1000);

const map = L.map('map', { zoomControl: false, attributionControl: false });
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_matter_no_labels/{z}/{x}/{y}{r}.png',
  { maxZoom: 19 }
).addTo(map);
map.setView([20, 0], 2);
L.control.zoom({ position: 'topright' }).addTo(map);

const _markers = {};
function placeMarker(row) {
  if (!row.latitude || !row.longitude) return;
  const bad   = row.is_known_bad;
  const color = bad ? '#b33a2a' : '#c87d1a';
  if (_markers[row.src_ip]) {
    _markers[row.src_ip].setStyle({ color, fillColor: color });
    return;
  }
  const m = L.circleMarker([row.latitude, row.longitude], {
    radius: 4, color, fillColor: color, fillOpacity: .75, weight: 1
  }).addTo(map);
  m.bindPopup(
    '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;line-height:1.6">' +
    '<strong>' + row.src_ip + '</strong><br>' +
    ([row.city, row.country].filter(Boolean).join(', ') || 'Unknown') + '<br>' +
    (row.isp ? row.isp + '<br>' : '') +
    (bad ? '<span style="color:#b33a2a">Known threat</span>' : '') +
    '</div>'
  );
  _markers[row.src_ip] = m;
}

const SVC_COLORS = [
  '#c87d1a','#8a5510','#7aaa5a','#60a0aa',
  '#8070c0','#aa7090','#cc5050','#708850','#aaa060'
];
const svcChart = new Chart(
  document.getElementById('svcChart').getContext('2d'),
  {
    type: 'doughnut',
    data: { labels: [], datasets: [{ data: [], backgroundColor: SVC_COLORS }] },
    options: {
      plugins: {
        legend: { labels: { color: '#7a7060', font: { family: "'IBM Plex Mono'", size: 10 }, boxWidth: 8, padding: 8 } }
      },
      cutout: '58%'
    }
  }
);

function renderBars(id, items, labelKey, countKey) {
  const el = document.getElementById(id);
  if (!items || !items.length) { el.innerHTML = '<span style="color:var(--dim);font-size:11px">No data yet</span>'; return; }
  const max = items[0][countKey] || 1;
  el.innerHTML = items.map(item =>
    '<div class="bar-row">' +
    '<div class="bar-label" title="' + (item[labelKey] || '') + '">' + (item[labelKey] || '—') + '</div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round(item[countKey] / max * 100) + '%"></div></div>' +
    '<div class="bar-count">' + Number(item[countKey]).toLocaleString() + '</div>' +
    '</div>'
  ).join('');
}

const tbody = document.getElementById('feed-tbody');
let feedTotal = 0;

function badgeHtml(svc) {
  const cls = (svc || '').toLowerCase();
  return '<span class="badge ' + cls + '">' + (svc || '?') + '</span>';
}

function addRow(row, flash) {
  const tr = document.createElement('tr');
  if (flash) tr.className = 'new-row';
  const time  = new Date(row.timestamp).toLocaleTimeString('en-GB', { hour12: false });
  const creds = [row.username || '', row.password || ''].filter(Boolean).join(' / ');
  const loc   = [row.city, row.country].filter(Boolean).join(', ') || '—';
  tr.innerHTML =
    '<td>' + time + '</td>' +
    '<td class="' + (row.is_known_bad ? 'ip-threat' : '') + '">' + (row.src_ip || '—') + '</td>' +
    '<td>' + badgeHtml(row.service) + '</td>' +
    '<td style="color:var(--dim)">' + (row.event_type || '') + '</td>' +
    '<td class="cred-text">' + (creds || '—') + '</td>' +
    '<td>' + loc + '</td>' +
    '<td>' + (row.is_known_bad ? '<span class="threat-yes">● THREAT</span>' : '<span class="threat-no">—</span>') + '</td>';
  tbody.prepend(tr);
  feedTotal++;
  document.getElementById('feed-count').textContent = feedTotal.toLocaleString() + ' events';
  while (tbody.rows.length > 500) tbody.deleteRow(tbody.rows.length - 1);
}

async function refreshStats() {
  try {
    const stats = await fetch('/api/stats').then(r => r.json());
    document.getElementById('s-total').textContent = Number(stats.total).toLocaleString();
    document.getElementById('s-1h').textContent    = Number(stats.last_hour).toLocaleString();
    document.getElementById('s-24h').textContent   = Number(stats.last_24h).toLocaleString();
    document.getElementById('s-bad').textContent   = Number(stats.known_bad_count).toLocaleString();
    svcChart.data.labels = stats.by_service.map(x => x.service);
    svcChart.data.datasets[0].data = stats.by_service.map(x => x.cnt);
    svcChart.update('none');
    renderBars('w-countries', stats.top_countries, 'country', 'cnt');
    renderBars('w-users',     stats.top_usernames, 'username', 'cnt');
    renderBars('w-passes',    stats.top_passwords, 'password', 'cnt');
    (stats.geo_points || []).forEach(placeMarker);
  } catch (e) { console.warn('Stats fetch failed:', e); }
}

async function loadEvents() {
  try {
    const events = await fetch('/api/events?limit=100').then(r => r.json());
    [...events].reverse().forEach(row => { addRow(row, false); placeMarker(row); });
  } catch (e) { console.warn('Events fetch failed:', e); }
}

function connectSSE() {
  const dot   = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  const es    = new EventSource('/api/stream');
  es.onopen = () => { dot.classList.add('live'); label.textContent = 'CONNECTED'; };
  es.onmessage = async () => {
    await refreshStats();
    try {
      const latest = await fetch('/api/events?limit=1').then(r => r.json());
      if (latest[0]) addRow(latest[0], true);
    } catch (_) {}
  };
  es.onerror = () => {
    dot.classList.remove('live');
    label.textContent = 'RECONNECTING';
    es.close();
    setTimeout(connectSSE, 5000);
  };
}

function doExport() {
  const btn     = document.getElementById('btn-export');
  const service = document.getElementById('ex-service').value;
  const since   = document.getElementById('ex-since').value;
  const format  = document.getElementById('ex-format').value;
  const limit   = document.getElementById('ex-limit').value;
  const params  = new URLSearchParams({ format, limit });
  if (service) params.set('service', service);
  if (since)   params.set('since', new Date(since).toISOString());
  btn.classList.add('loading');
  btn.textContent = 'Exporting…';
  const a = document.createElement('a');
  a.href = '/api/export?' + params.toString();
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => { btn.classList.remove('loading'); btn.textContent = 'Export'; }, 2000);
}

(async () => {
  await refreshStats();
  await loadEvents();
  connectSSE();
  setInterval(refreshStats, 30000);
})();
</script>
</body>
</html>
